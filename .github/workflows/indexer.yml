name: Index Base Sepolia pots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: base-sepolia-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Index confirmed contract events
        env:
          INDEXER_CRON_SECRET: ${{ secrets.INDEXER_CRON_SECRET }}
        run: |
          test -n "$INDEXER_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --max-time 90 \
            --request POST \
            --header "Authorization: Bearer ${INDEXER_CRON_SECRET}" \
            --header "Accept: application/json" \
            https://potonbase.vercel.app/api/indexer
